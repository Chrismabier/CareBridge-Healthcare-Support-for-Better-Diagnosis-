# One command deployment:  docker compose up --build
# Console: http://localhost:3000        Console page: http://localhost:3000/console.html

services:
  carebridge:
    build: .
    image: carebridge:latest
    container_name: carebridge
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      CB_SESSION_TTL_MIN: 30
      CB_MAX_SESSIONS: 50
    volumes:
      # Keeps live session data across container restarts.
      - carebridge-sessions:/app/web/runtime/sessions
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Bridge AI Personal Assistant (assistant/) -> http://localhost:8000
  # Offline demo mode by default; uncomment LLM_* for full AI answers.
  assistant:
    build:
      context: .
      dockerfile: Dockerfile.assistant
    image: bridge-assistant:latest
    container_name: bridge-assistant
    restart: unless-stopped
    ports:
      - "${ASSISTANT_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      # LLM_API_KEY: ""
      # LLM_BASE_URL: https://api.openai.com/v1
      # LLM_MODEL: gpt-4o-mini
    volumes:
      - bridge-data:/app/assistant/data

volumes:
  carebridge-sessions:
  bridge-data:
