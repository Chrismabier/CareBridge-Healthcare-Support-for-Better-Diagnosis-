# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard > New > Blueprint > connect this repo. Render builds the Docker
# image, serves it on $PORT and health-checks /api/health.

services:
  - type: web
    name: carebridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CB_SESSION_TTL_MIN
        value: "30"
      - key: CB_MAX_SESSIONS
        value: "50"
